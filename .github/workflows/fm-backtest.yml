name: Public partner contact verification
on:
  push:
    branches: [research/fm-backtest-20261119]
    paths: ['.github/workflows/fm-backtest.yml']
permissions:
  contents: read
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fm-backtest-20261119
      - run: python research/partner-contact-research.py
