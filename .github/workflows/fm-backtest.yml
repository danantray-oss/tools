name: Official procurement daily file schema probe
on:
  push:
    branches: [research/fm-backtest-20261119]
    paths: ['.github/workflows/fm-backtest.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fm-backtest-20261119
      - name: Discover daily public data manifests
        run: python research/fm-archive-schema.py
